name: Notify IndexNow after production deploy

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/indexnow.yml"
      - "next.config.ts"
      - "package.json"
      - "pnpm-lock.yaml"
      - "public/**"
      - "scripts/indexnow-submit.mjs"
      - "src/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cyvexly-indexnow-production
  cancel-in-progress: true

jobs:
  notify:
    if: github.repository == 'craftonmeagen-arch/cyvexly-studio'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_URL: https://cyvexly.com
      EXPECTED_COMMIT: ${{ github.sha }}
    steps:
      - name: Check out the submitted release
        uses: actions/checkout@v4

      - name: Wait for Render and notify IndexNow
        run: node scripts/indexnow-submit.mjs
